name: ci

on:
  push:
  pull_request:

jobs:
  single-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          clojure --version

      - name: Install Babashka
        run: |
          curl -sL -O https://github.com/babashka/babashka/releases/download/v1.13.229/babashka-1.13.229-linux-amd64-static.tar.gz
          tar xzf babashka-1.13.229-linux-amd64-static.tar.gz
          sudo mv bb /usr/local/bin/bb
          bb --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build tools
        run: cargo build --release --manifest-path tools/Cargo.toml

      - name: Check cold-cache runner run
        run: |
          rm -rf ~/.m2/repository
          ./runners/single-exec/clojure tests/single-exec/00001.clj

      - name: Run single-exec suite (clojure)
        run: |
          ./single-exec clojure | tee clojure.tap
          ./scripts/tapsummary < clojure.tap
          if grep -q '^not ok' clojure.tap; then echo "clojure runner had failures" >&2; exit 1; fi

      - name: Run single-exec suite (babashka)
        run: |
          ./single-exec babashka | tee babashka.tap
          ./scripts/tapsummary < babashka.tap
          if grep -q '^not ok' babashka.tap; then echo "babashka runner had failures" >&2; exit 1; fi

      - name: Check search queries
        run: |
          test "$(./scripts/search-tests "suite=single-exec" | grep -c .)" -eq 83
          test "$(./scripts/search-tests "portable" | grep -c .)" -eq 70
          test "$(./scripts/search-tests "needs-java-interop" | grep -c .)" -eq 5
          test "$(./scripts/search-tests "needs-io" | grep -c .)" -eq 1
          test "$(./scripts/search-tests "needs-threads" | grep -c .)" -eq 6
          test -z "$(./runners/single-exec/clojure.skip)"
          ./runners/single-exec/babashka.skip | sort > /tmp/bb-skip.txt
          printf '%s\n' \
            ./tests/single-exec/00042.clj \
            ./tests/single-exec/00045.clj \
            ./tests/single-exec/00051.clj \
            ./tests/single-exec/00082.clj > /tmp/bb-skip-expected.txt
          diff /tmp/bb-skip-expected.txt /tmp/bb-skip.txt
